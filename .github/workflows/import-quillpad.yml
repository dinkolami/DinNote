name: Import Quillpad upstream (migration branch)
on:
  workflow_dispatch:
  push:
    branches: [quillpad-migration]

concurrency:
  group: dinnote-quillpad-migration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated migration branch
        uses: actions/checkout@v4
        with:
          ref: quillpad-migration
          persist-credentials: true
      - name: Fetch complete upstream Quillpad source
        if: ${{ hashFiles('app/build.gradle.kts') == '' }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/quillpad/quillpad.git /tmp/quillpad-upstream
          git -C /tmp/quillpad-upstream rev-parse HEAD | tee /tmp/quillpad-upstream-sha
          test -f /tmp/quillpad-upstream/LICENSE || test -f /tmp/quillpad-upstream/LICENSE.md || test -f /tmp/quillpad-upstream/COPYING
      - name: Import source while retaining this migration workflow
        if: ${{ hashFiles('app/build.gradle.kts') == '' }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/dinnote-workflow
          cp .github/workflows/import-quillpad.yml /tmp/dinnote-workflow/import-quillpad.yml
          if [ ! -f app/build.gradle.kts ]; then
            rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/quillpad-upstream/ ./
          else
            echo 'Existing DinNote migration source detected; preserving local modifications.'
          fi
          mkdir -p .github/workflows
          cp /tmp/dinnote-workflow/import-quillpad.yml .github/workflows/import-quillpad.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import Quillpad upstream source for DinNote migration"
            git push origin HEAD:quillpad-migration
          fi
      - name: Verify imported Android project files
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f gradlew
          test -f LICENSE || test -f LICENSE.md || test -f COPYING
          echo "Upstream source imported. Rename and integration are separate steps."

  build:
    needs: import
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out imported Quillpad source
        uses: actions/checkout@v4
        with:
          ref: quillpad-migration
      - name: Verify migration app identity
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.dinkolami.dinnote.quillpad"' app/build.gradle.kts
          grep -Fq 'android:label="DinNote"' app/src/main/AndroidManifest.xml
          grep -Fq '<string name="nav_notes">Nota</string>' app/src/main/res/values/strings.xml
          grep -Fq '<string name="nav_notebooks">Maktabah</string>' app/src/main/res/values/strings.xml
          echo 'DinNote migration identity and navigation labels verified.'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager --install 'platforms;android-37' 'build-tools;36.0.0'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log
      - name: Verify generated APK
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$apk"
          test -s "$apk"
          echo "Verified non-empty APK: $apk"
          sha256sum "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee /tmp/dinnote-apk-badging.txt
          grep -Fq "package: name='com.dinkolami.dinnote.quillpad'" /tmp/dinnote-apk-badging.txt
          grep -Eq "application-label(-[a-zA-Z0-9_-]+)?:'DinNote'" /tmp/dinnote-apk-badging.txt
          echo 'Verified APK package and launcher label.'
      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dinnote-gradle-failure-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record build diagnostics
        if: always()
        run: |
          {
            echo "## DinNote Quillpad migration build"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- APK files:"
            find app/build/outputs/apk -name '*.apk' -type f -printf '  - %p (%s bytes)\\n' 2>/dev/null || true
            echo "- Check the Build debug APK step for Gradle errors if no APK exists."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quillpad-migration-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
