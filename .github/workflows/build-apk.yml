name: Build DinNote APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DINNOTE_KEYSTORE_B64: ${{ secrets.DINNOTE_KEYSTORE_B64 }}
      DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
      DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
      DINNOTE_KEY_PASSWORD: ${{ secrets.DINNOTE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check release signing secrets
        id: signing
        shell: bash
        run: |
          if [[ -n "$DINNOTE_KEYSTORE_B64" && -n "$DINNOTE_STORE_PASSWORD" && -n "$DINNOTE_KEY_ALIAS" && -n "$DINNOTE_KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are missing; building debug APK only."
          fi
      - name: Restore release keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          umask 077
          printf '%s' "$DINNOTE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dinnote-release.jks"
          echo "DINNOTE_KEYSTORE_PATH=$RUNNER_TEMP/dinnote-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify release APK signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Build debug APK
        if: steps.signing.outputs.ready != 'true'
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/dinnote-release.jks"
