name: Build DinNote APK
run-name: DinNote APK • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print source revision
        run: |
          echo "Building DinNote from commit: $GITHUB_SHA"
          git log -1 --format='%h %s'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build clean APK
        run: gradle --no-build-cache clean assembleDebug --stacktrace --console=plain

      - name: Verify and identify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DinNote-${GITHUB_SHA:0:7}-debug.apk"
          printf 'Commit: %s\nBuild: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD-INFO.txt
          ls -lh dist/

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-APK-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
