name: Build DinNote APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build test APK without signing secrets
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/dinnote-debug-build.log" || {
            echo "::group::DinNote first compiler and Gradle errors"
            grep -n -m 35 -E '(^|[[:space:]])(error:|e: |FAILURE:|What went wrong:|Execution failed for task|AAPT:|cannot find symbol|symbol:|location:)' "$RUNNER_TEMP/dinnote-debug-build.log" || true
            echo "::endgroup::"
            exit 1
          }
      - name: Upload failed debug build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-debug-build-failure-log
          path: ${{ runner.temp }}/dinnote-debug-build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-debug-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Check release signing secrets
        id: signing
        env:
          KS: ${{ secrets.DINNOTE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          KA: ${{ secrets.DINNOTE_KEY_ALIAS }}
          KP: ${{ secrets.DINNOTE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$SP" ] && [ -n "$KA" ] && [ -n "$KP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets incomplete. Debug APK remains available; signed release skipped."
          fi
      - name: Decode release keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          KS: ${{ secrets.DINNOTE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/dinnote-release.jks"
          test -s "$RUNNER_TEMP/dinnote-release.jks"
      - name: Validate release keystore
        if: steps.signing.outputs.ready == 'true'
        env:
          DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if ! keytool -list -keystore "$RUNNER_TEMP/dinnote-release.jks" -storepass:env DINNOTE_STORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::Keystore tidak boleh dibuka. Semak fail Base64 dan store password tanpa menukar kunci asal."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/dinnote-release.jks" -storepass:env DINNOTE_STORE_PASSWORD -alias "$DINNOTE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Alias tidak ditemui dalam keystore. Semak DINNOTE_KEY_ALIAS; jangan jana keystore baharu."
            exit 1
          fi
          echo "::notice::Keystore dan alias disahkan. Kunci asal tidak diubah."
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          DINNOTE_KEYSTORE_FILE: ${{ runner.temp }}/dinnote-release.jks
          DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
          DINNOTE_KEY_PASSWORD: ${{ secrets.DINNOTE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify release signature
        if: steps.signing.outputs.ready == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
