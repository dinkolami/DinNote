name: Build DinNote APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.DINNOTE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Build clean debug APK
        run: |
          set -o pipefail
          gradle --stop || true
          gradle clean :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/dinnote-build.log"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-build-error-log
          path: ${{ runner.temp }}/dinnote-build.log
          if-no-files-found: warn
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload fresh APK
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-fresh-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          DINNOTE_KEYSTORE_BASE64: ${{ secrets.DINNOTE_KEYSTORE_BASE64 }}
          DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
          DINNOTE_KEY_PASSWORD: ${{ secrets.DINNOTE_KEY_PASSWORD }}
        run: |
          echo "$DINNOTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dinnote-release.jks"
          export DINNOTE_KEYSTORE_PATH="$RUNNER_TEMP/dinnote-release.jks"
          gradle :app:assembleRelease --no-daemon --console=plain
      - name: Upload signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
