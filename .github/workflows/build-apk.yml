name: Build DinNote APK
run-name: DinNote APK • ${{ github.ref_name }} • ${{ github.sha }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Print source revision
        run: |
          echo "Building DinNote from commit: $GITHUB_SHA"
          git log -1 --format='%h %s'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure persistent signing key
        env:
          DINNOTE_KEYSTORE_BASE64: ${{ secrets.DINNOTE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DINNOTE_KEYSTORE_BASE64" ]; then
            echo "::error::DINNOTE_KEYSTORE_BASE64 is empty. Restore the ORIGINAL signing keystore as a repository secret to preserve APK update compatibility."
            exit 1
          fi
          # Accept base64 pasted with line breaks or spaces, but never print the secret.
          if ! printf '%s' "$DINNOTE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > app/dinnote-debug.keystore; then
            rm -f app/dinnote-debug.keystore
            echo "::error::DINNOTE_KEYSTORE_BASE64 is not valid Base64. Re-encode the ORIGINAL keystore file; do not generate a new key if existing installs must update."
            exit 1
          fi
          if [ ! -s app/dinnote-debug.keystore ]; then
            echo "::error::Decoded keystore is empty."
            exit 1
          fi

      - name: Validate keystore before Gradle build
        run: |
          if ! keytool -list -keystore app/dinnote-debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::Signing keystore cannot be opened with the expected Android debug key credentials (alias androiddebugkey, store password android). Check that the secret contains the ORIGINAL compatible debug keystore."
            exit 1
          fi
          echo "Signing keystore validated; key contents remain private."

      - name: Set persistent debug signing
        run: |
          mkdir -p "$HOME/.android"
          cp app/dinnote-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          rm app/dinnote-debug.keystore

      - name: Build clean APK
        run: |
          VERSION_CODE=$((240000 + GITHUB_RUN_NUMBER))
          echo "Building versionCode=$VERSION_CODE versionName=2.4.$GITHUB_RUN_NUMBER"
          gradle --no-build-cache clean assembleDebug -PdinnoteVersionCode="$VERSION_CODE" -PdinnoteVersionName="2.4.$GITHUB_RUN_NUMBER" --stacktrace --console=plain

      - name: Verify packaged app identity and build version
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          EXPECTED_CODE=$((240000 + GITHUB_RUN_NUMBER))
          EXPECTED_NAME="2.4.$GITHUB_RUN_NUMBER"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.dinnote.app'"
          printf '%s\n' "$BADGING" | grep -F "versionCode='$EXPECTED_CODE'"
          printf '%s\n' "$BADGING" | grep -F "versionName='$EXPECTED_NAME'"
          echo "Verified APK package, versionCode and versionName for commit $GITHUB_SHA"

      - name: Verify APK signing certificate
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK signature verification passed. Compare the printed SHA-256 signer fingerprint with the previously installed DinNote APK before claiming in-place update compatibility."

      - name: Check signing certificate against pinned fingerprint
        env:
          EXPECTED_SIGNER_SHA256: ${{ vars.DINNOTE_SIGNER_SHA256 }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Cannot determine APK signer certificate fingerprint."
            exit 1
          fi
          echo "APK signer SHA-256: $ACTUAL"
          if [ -z "$EXPECTED_SIGNER_SHA256" ]; then
            echo "::warning::Set repository variable DINNOTE_SIGNER_SHA256 to the certificate fingerprint of the APK currently installed on the phone. Update compatibility is NOT verified."
          else
            EXPECTED=$(printf '%s' "$EXPECTED_SIGNER_SHA256" | tr '[:lower:]' '[:upper:]' | tr -d ':[:space:]')
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK signing certificate differs from the pinned installed-app certificate. In-place updates will fail. Restore the matching original keystore."
              exit 1
            fi
            echo "APK signing certificate matches pinned fingerprint."
          fi

      - name: Verify and identify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/DinNote-${GITHUB_SHA:0:7}-debug.apk"
          APK_NAME="DinNote-${GITHUB_SHA:0:7}-debug.apk"
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Build run: %s\n' "$GITHUB_RUN_ID"
            printf 'Build number: %s\n' "$GITHUB_RUN_NUMBER"
            printf 'Version name: 2.4.%s\n' "$GITHUB_RUN_NUMBER"
            printf 'Version code: %s\n' "$((240000 + GITHUB_RUN_NUMBER))"
            printf 'Package: com.dinnote.app\n'
            printf 'APK file: %s\n' "$APK_NAME"
            printf 'APK SHA-256: %s\n' "$(sha256sum "dist/$APK_NAME" | cut -d ' ' -f1)"
            printf 'Workflow: %s/actions/runs/%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > dist/BUILD-INFO.txt
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          echo "Build provenance:"
          cat dist/BUILD-INFO.txt
          ls -lh dist/

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-APK-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
