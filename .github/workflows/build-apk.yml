name: Build DinNote APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.DINNOTE_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Require release signing secrets
        env:
          DINNOTE_KEYSTORE_BASE64: ${{ secrets.DINNOTE_KEYSTORE_BASE64 }}
          DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
          DINNOTE_KEY_PASSWORD: ${{ secrets.DINNOTE_KEY_PASSWORD }}
        run: |
          for key in DINNOTE_KEYSTORE_BASE64 DINNOTE_STORE_PASSWORD DINNOTE_KEY_ALIAS DINNOTE_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "Missing signing secret: $key"; exit 1; fi
          done
      - name: Build clean debug APK
        run: |
          set -o pipefail
          gradle --stop || true
          gradle clean :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/dinnote-build.log"
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-build-error-log
          path: ${{ runner.temp }}/dinnote-build.log
          if-no-files-found: warn
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release APK
        env:
          DINNOTE_KEYSTORE_BASE64: ${{ secrets.DINNOTE_KEYSTORE_BASE64 }}
          DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
          DINNOTE_KEY_PASSWORD: ${{ secrets.DINNOTE_KEY_PASSWORD }}
        run: |
          printf '%s' "$DINNOTE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dinnote-release.jks"
          export DINNOTE_KEYSTORE_PATH="$RUNNER_TEMP/dinnote-release.jks"
          gradle :app:assembleRelease --no-daemon --console=plain
      - name: Verify release APK signature and version
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
      - name: Diagnose APK install compatibility
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          echo "=== APK file size ==="
          ls -lh "$APK"
          stat -c 'APK bytes: %s' "$APK"
          echo "=== Package, SDK and version ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|launchable-activity:)"
          echo "=== Signing certificate ==="
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "=== APK entries ==="
          unzip -l "$APK" | tail -n 25
          echo "Note: GitHub cannot detect installed-app signature conflicts on a user's phone."
      - name: Report APK size and 30 MB advisory target
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BYTES=$(stat -c '%s' "$APK")
          MIB=$(awk -v bytes="$BYTES" 'BEGIN { printf "%.2f", bytes/1048576 }')
          LIMIT=$((30 * 1024 * 1024))
          if [ "$BYTES" -gt "$LIMIT" ]; then
            STATUS="Melebihi sasaran 30 MiB — semak pustaka OCR dan sumber besar"
          else
            STATUS="Dalam sasaran 30 MiB"
          fi
          {
            echo "## DinNote APK size"
            echo ""
            echo "| Metrik | Nilai |"
            echo "|---|---|"
            echo "| Fail | app-release.apk |"
            echo "| Saiz | ${MIB} MiB (${BYTES} bait) |"
            echo "| Sasaran awal | 30 MiB (bukan had wajib) |"
            echo "| Penilaian | ${STATUS} |"
            echo ""
            echo "Saiz pemasangan dan penggunaan RAM pada telefon memerlukan ujian peranti berasingan."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$STATUS: $MIB MiB"
      - name: Upload signed release APK
        if: env.HAS_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DinNote-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
