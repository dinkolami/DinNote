name: Build DinNote APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Require permanent signing secrets
        env:
          KS: ${{ secrets.DINNOTE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          KA: ${{ secrets.DINNOTE_KEY_ALIAS }}
          KP: ${{ secrets.DINNOTE_KEY_PASSWORD }}
        run: |
          test -n "$KS" && test -n "$SP" && test -n "$KA" && test -n "$KP" || { echo "::error::Permanent signing secrets are missing. No APK will be published."; exit 1; }
          # GitHub Secrets may contain copied line breaks or spaces.
          printf '%s' "$KS" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/dinnote-release.jks" || { echo "::error::Keystore Base64 is invalid or incomplete."; exit 1; }
          test -s "$RUNNER_TEMP/dinnote-release.jks" || { echo "::error::Decoded keystore is empty."; exit 1; }
      - name: Validate signing keystore
        env:
          DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/dinnote-release.jks" || { echo "::error::Keystore file is empty."; exit 1; }
          if ! keytool -list -keystore "$RUNNER_TEMP/dinnote-release.jks" -storepass:env DINNOTE_STORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::Keystore cannot be opened with the store password. Check Base64 file and DINNOTE_STORE_PASSWORD."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/dinnote-release.jks" -storepass:env DINNOTE_STORE_PASSWORD -alias "$DINNOTE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore opens, but DINNOTE_KEY_ALIAS does not match an entry."
            exit 1
          fi
          echo "Signing keystore and alias validated."
      - name: Build signed release APK
        env:
          DINNOTE_KEYSTORE_FILE: ${{ runner.temp }}/dinnote-release.jks
          DINNOTE_STORE_PASSWORD: ${{ secrets.DINNOTE_STORE_PASSWORD }}
          DINNOTE_KEY_ALIAS: ${{ secrets.DINNOTE_KEY_ALIAS }}
          DINNOTE_KEY_PASSWORD: ${{ secrets.DINNOTE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DinNote-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
