name: Build DinNote APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted Ubuntu runners already provide the Android SDK.
      # setup-android@v3 attempts to install obsolete SDK package "tools"
      # and fails before Gradle can build.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DinNote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
